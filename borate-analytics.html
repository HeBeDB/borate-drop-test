<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Borate Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="src/borate-calculations.js"></script>
    <script src="src/borate-storage.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-purple-100 min-h-screen">
    <div id="root"></div>

    <script>
        function AnalyticsApp() {
            const tests = BorateStor.getPoolTests();
            const depletion = BorateCaclulations.calculateDepletionRate(tests);
            const latestTest = BorateStor.getLatestTest();
            const currentPpm = latestTest ? latestTest.ppm : 0;
            
            // Calculate statistics
            const avgPpm = tests.length > 0 ? 
                Math.round(tests.reduce((sum, t) => sum + t.ppm, 0) / tests.length) : 0;
            const minPpm = tests.length > 0 ? Math.min(...tests.map(t => t.ppm)) : 0;
            const maxPpm = tests.length > 0 ? Math.max(...tests.map(t => t.ppm)) : 0;

            // Prediction
            let prediction = null;
            if (depletion.hasData && depletion.ratePerMonth < 0) {
                prediction = BorateCaclulations.estimateDaysUntilAddition(currentPpm, depletion.ratePerMonth, 30);
            }

            return `
                <div class="max-w-4xl mx-auto p-4">
                    <!-- Header -->
                    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <h1 class="text-2xl font-bold text-gray-900">📊 Analytics</h1>
                                <p class="text-gray-600 mt-1">Trends and predictive analysis</p>
                            </div>
                            <a href="index.html" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                                ← Dashboard
                            </a>
                        </div>
                    </div>

                    ${tests.length < 2 ? `
                        <!-- Not enough data -->
                        <div class="bg-white rounded-lg shadow-lg p-8 text-center">
                            <div class="text-6xl mb-4">📈</div>
                            <h2 class="text-xl font-bold text-gray-900 mb-2">Not Enough Data</h2>
                            <p class="text-gray-600 mb-4">You need at least 2 tests to see analytics and trends.</p>
                            <p class="text-gray-500">Current tests: ${tests.length}</p>
                            <a href="borate-drop-test.html" class="inline-block mt-4 px-6 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                                🧪 Run a Test
                            </a>
                        </div>
                    ` : `
                        <!-- Stats Cards -->
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                            <div class="bg-white rounded-lg shadow p-4 text-center">
                                <div class="text-sm text-gray-500 mb-1">Current</div>
                                <div class="text-2xl font-bold ${currentPpm >= 30 && currentPpm <= 50 ? 'text-green-600' : 'text-amber-600'}">${currentPpm} ppm</div>
                            </div>
                            <div class="bg-white rounded-lg shadow p-4 text-center">
                                <div class="text-sm text-gray-500 mb-1">Average</div>
                                <div class="text-2xl font-bold text-purple-600">${avgPpm} ppm</div>
                            </div>
                            <div class="bg-white rounded-lg shadow p-4 text-center">
                                <div class="text-sm text-gray-500 mb-1">Min / Max</div>
                                <div class="text-2xl font-bold text-blue-600">${minPpm} / ${maxPpm}</div>
                            </div>
                            <div class="bg-white rounded-lg shadow p-4 text-center">
                                <div class="text-sm text-gray-500 mb-1">Trend</div>
                                <div class="text-2xl font-bold ${depletion.ratePerMonth < -3 ? 'text-red-600' : depletion.ratePerMonth < 0 ? 'text-amber-600' : 'text-green-600'}">
                                    ${depletion.ratePerMonth > 0 ? '+' : ''}${depletion.ratePerMonth}/mo
                                </div>
                            </div>
                        </div>

                        <!-- Chart -->
                        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <h2 class="text-xl font-bold text-gray-900 mb-4">Borate Level History</h2>
                            <div class="h-64">
                                <canvas id="boratChart"></canvas>
                            </div>
                        </div>

                        <!-- Depletion Analysis -->
                        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <h2 class="text-xl font-bold text-gray-900 mb-4">📉 Depletion Analysis</h2>
                            
                            <div class="grid md:grid-cols-2 gap-6">
                                <div>
                                    <h3 class="font-semibold text-gray-700 mb-2">Rate of Change</h3>
                                    <div class="bg-gray-50 rounded-lg p-4">
                                        <div class="text-3xl font-bold ${depletion.ratePerMonth < 0 ? 'text-amber-600' : 'text-green-600'}">
                                            ${depletion.ratePerMonth > 0 ? '+' : ''}${depletion.ratePerMonth} ppm/month
                                        </div>
                                        <p class="text-sm text-gray-600 mt-2">
                                            ${depletion.trend === 'decreasing' ? '↓ Levels are declining over time' : 
                                              depletion.trend === 'increasing' ? '↑ Levels are increasing' : 
                                              '→ Levels are stable'}
                                        </p>
                                        <p class="text-sm text-gray-500 mt-1">
                                            Based on ${tests.length} tests over ${depletion.daysBetween} days
                                        </p>
                                    </div>
                                </div>

                                <div>
                                    <h3 class="font-semibold text-gray-700 mb-2">Prediction</h3>
                                    <div class="bg-gray-50 rounded-lg p-4">
                                        ${prediction ? `
                                            ${prediction.daysUntil === 0 ? `
                                                <div class="text-xl font-bold text-red-600">Addition needed now!</div>
                                                <p class="text-sm text-gray-600 mt-2">Level is below 30 ppm minimum</p>
                                            ` : `
                                                <div class="text-3xl font-bold text-blue-600">${prediction.daysUntil} days</div>
                                                <p class="text-sm text-gray-600 mt-2">
                                                    Until level drops below 30 ppm<br>
                                                    (around ${prediction.estimatedDate})
                                                </p>
                                            `}
                                        ` : `
                                            <div class="text-xl font-bold text-green-600">No addition needed</div>
                                            <p class="text-sm text-gray-600 mt-2">
                                                ${currentPpm >= 30 ? 'Levels are stable or increasing' : 'Not enough trend data'}
                                            </p>
                                        `}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Test History Table -->
                        <div class="bg-white rounded-lg shadow-lg p-6">
                            <h2 class="text-xl font-bold text-gray-900 mb-4">Test History</h2>
                            <div class="overflow-x-auto">
                                <table class="w-full text-sm">
                                    <thead>
                                        <tr class="border-b border-gray-200">
                                            <th class="text-left py-2 px-3">Date</th>
                                            <th class="text-right py-2 px-3">Drops</th>
                                            <th class="text-right py-2 px-3">PPM</th>
                                            <th class="text-right py-2 px-3">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${tests.slice(0, 20).map((t, i) => {
                                            const status = BorateCaclulations.checkLevel(t.ppm);
                                            const change = i < tests.length - 1 ? t.ppm - tests[i + 1].ppm : 0;
                                            return `
                                                <tr class="border-b border-gray-100">
                                                    <td class="py-2 px-3">${formatDate(t.date)}</td>
                                                    <td class="text-right py-2 px-3">${t.drops}</td>
                                                    <td class="text-right py-2 px-3 font-semibold">
                                                        ${t.ppm}
                                                        ${change !== 0 ? `<span class="${change > 0 ? 'text-green-600' : 'text-red-600'} text-xs ml-1">(${change > 0 ? '+' : ''}${change})</span>` : ''}
                                                    </td>
                                                    <td class="text-right py-2 px-3">
                                                        <span class="px-2 py-1 rounded text-xs ${status.inRange ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'}">
                                                            ${status.status}
                                                        </span>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                                ${tests.length > 20 ? `<p class="text-sm text-gray-500 mt-2 text-center">Showing 20 of ${tests.length} tests</p>` : ''}
                            </div>
                        </div>
                    `}

                    <!-- Info -->
                    <div class="bg-blue-50 border border-blue-300 rounded-lg p-6 mt-6">
                        <h3 class="font-bold text-blue-900 mb-3">💡 Understanding Your Data</h3>
                        <ul class="text-sm text-blue-800 space-y-1 ml-4 list-disc">
                            <li><strong>Optimal range:</strong> 30-50 ppm (50 ppm is EPA maximum)</li>
                            <li><strong>Typical depletion:</strong> 2-5 ppm per month from backwashing and splash-out</li>
                            <li><strong>Heavy depletion:</strong> May indicate excessive water loss or dilution</li>
                            <li><strong>Test frequency:</strong> Every 60-90 days is usually sufficient</li>
                        </ul>
                    </div>
                </div>
            `;
        }

        function formatDate(isoDate) {
            return new Date(isoDate).toLocaleDateString();
        }

        // Render app
        document.getElementById('root').innerHTML = AnalyticsApp();

        // Draw chart if we have data
        const tests = BorateStor.getPoolTests();
        if (tests.length >= 2) {
            const sortedTests = [...tests].sort((a, b) => new Date(a.date) - new Date(b.date));
            const labels = sortedTests.map(t => new Date(t.date).toLocaleDateString());
            const data = sortedTests.map(t => t.ppm);

            const ctx = document.getElementById('boratChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Borate Level (ppm)',
                        data: data,
                        borderColor: 'rgb(147, 51, 234)',
                        backgroundColor: 'rgba(147, 51, 234, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: false,
                            min: Math.max(0, Math.min(...data) - 10),
                            max: Math.max(...data) + 10,
                            grid: {
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        annotation: {
                            annotations: {
                                minLine: {
                                    type: 'line',
                                    yMin: 30,
                                    yMax: 30,
                                    borderColor: 'rgba(251, 191, 36, 0.5)',
                                    borderWidth: 2,
                                    borderDash: [5, 5]
                                },
                                maxLine: {
                                    type: 'line',
                                    yMin: 50,
                                    yMax: 50,
                                    borderColor: 'rgba(251, 191, 36, 0.5)',
                                    borderWidth: 2,
                                    borderDash: [5, 5]
                                }
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
