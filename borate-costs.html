<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost Tracking - Borate Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="src/borate-calculations.js"></script>
    <script src="src/borate-storage.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 min-h-screen">
    <div id="root"></div>

    <script>
        let showAddForm = false;

        function render() {
            document.getElementById('root').innerHTML = CostsApp();
        }

        function CostsApp() {
            const purchases = BorateStor.getPurchases();
            const totalSpent = BorateStor.getTotalSpending();
            const boraxSpent = BorateStor.getTotalSpending('borax');
            const boricAcidSpent = BorateStor.getTotalSpending('boric_acid');
            const acidSpent = BorateStor.getTotalSpending('muriatic_acid');
            const reagentSpent = purchases.filter(p => p.item.startsWith('reagent')).reduce((sum, p) => sum + (p.price || 0), 0);

            return `
                <div class="max-w-2xl mx-auto p-4">
                    <!-- Header -->
                    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <h1 class="text-2xl font-bold text-gray-900">💰 Cost Tracking</h1>
                                <p class="text-gray-600 mt-1">Monitor expenses and ROI</p>
                            </div>
                            <a href="index.html" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                                ← Dashboard
                            </a>
                        </div>
                    </div>

                    <!-- Summary Cards -->
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-white rounded-lg shadow p-4 text-center">
                            <div class="text-sm text-gray-500 mb-1">Total Spent</div>
                            <div class="text-3xl font-bold text-green-600">$${totalSpent.toFixed(2)}</div>
                        </div>
                        <div class="bg-white rounded-lg shadow p-4 text-center">
                            <div class="text-sm text-gray-500 mb-1">Purchases</div>
                            <div class="text-3xl font-bold text-blue-600">${purchases.length}</div>
                        </div>
                    </div>

                    <!-- Breakdown -->
                    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                        <h2 class="text-lg font-bold text-gray-900 mb-4">Spending Breakdown</h2>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-gray-600">Borax</span>
                                <span class="font-semibold text-gray-900">$${boraxSpent.toFixed(2)}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-600">Boric Acid</span>
                                <span class="font-semibold text-gray-900">$${boricAcidSpent.toFixed(2)}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-600">Muriatic Acid</span>
                                <span class="font-semibold text-gray-900">$${acidSpent.toFixed(2)}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-gray-600">Test Reagents</span>
                                <span class="font-semibold text-gray-900">$${reagentSpent.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Add Button / Form -->
                    ${showAddForm ? renderAddForm() : `
                        <button onclick="toggleAddForm()" class="w-full mb-6 px-6 py-4 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-semibold text-lg">
                            ➕ Log Purchase
                        </button>
                    `}

                    <!-- Purchase History -->
                    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                        <h2 class="text-xl font-bold text-gray-900 mb-4">Purchase History</h2>
                        
                        ${purchases.length === 0 ? `
                            <div class="text-center py-8 text-gray-500">
                                <p class="text-4xl mb-2">🧾</p>
                                <p>No purchases logged yet</p>
                                <p class="text-sm mt-2">Track your chemical and reagent purchases</p>
                            </div>
                        ` : `
                            <div class="space-y-3">
                                ${purchases.map(p => `
                                    <div class="border border-green-200 rounded-lg p-4 bg-green-50 flex justify-between items-center">
                                        <div>
                                            <div class="font-semibold text-gray-900">${formatItem(p.item)}</div>
                                            <div class="text-sm text-gray-600">
                                                ${p.quantity} ${p.unit} ${p.vendor ? '• ' + p.vendor : ''}
                                            </div>
                                            <div class="text-xs text-gray-500">${formatDate(p.date)}</div>
                                        </div>
                                        <div class="text-right">
                                            <div class="text-xl font-bold text-green-600">$${(p.price || 0).toFixed(2)}</div>
                                            <button onclick="deletePurchase(${p.id})" class="text-red-500 text-sm hover:text-red-700">
                                                Delete
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `}
                    </div>

                    <!-- ROI Info -->
                    <div class="bg-blue-50 border border-blue-300 rounded-lg p-6">
                        <h3 class="font-bold text-blue-900 mb-3">💡 Borate ROI Benefits</h3>
                        <ul class="text-sm text-blue-800 space-y-2 ml-4 list-disc">
                            <li><strong>~33% less chlorine needed</strong> - Borates reduce minimum FC requirements</li>
                            <li><strong>Less acid usage</strong> - pH buffering means fewer acid additions</li>
                            <li><strong>One-time cost</strong> - Borates stay in water 6-12 months</li>
                            <li><strong>Fewer algae treatments</strong> - Borates inhibit algae growth</li>
                        </ul>
                        <p class="text-sm text-blue-700 mt-3 italic">
                            Most pool owners report borate maintenance pays for itself within 1-2 seasons through reduced chemical costs.
                        </p>
                    </div>
                </div>
            `;
        }

        function renderAddForm() {
            return `
                <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-gray-900">Log Purchase</h2>
                        <button onclick="toggleAddForm()" class="text-gray-500 hover:text-gray-700">✕</button>
                    </div>

                    <form onsubmit="savePurchase(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Item</label>
                            <select id="item" required class="w-full px-4 py-3 border-2 border-green-300 rounded-lg">
                                <option value="borax">Borax (20 Mule Team)</option>
                                <option value="boric_acid">Boric Acid</option>
                                <option value="muriatic_acid">Muriatic Acid</option>
                                <option value="reagent_R0007">Reagent R-0007 (Thiosulfate)</option>
                                <option value="reagent_R0009">Reagent R-0009 (Sulfuric Acid)</option>
                                <option value="reagent_R0010">Reagent R-0010 (Calcium Buffer)</option>
                                <option value="reagent_BTB">Reagent BTB (Bromothymol Blue)</option>
                                <option value="reagent_mannitol">Mannitol Powder</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Quantity</label>
                                <input type="number" id="quantity" required min="0" step="0.1"
                                    class="w-full px-4 py-3 border-2 border-green-300 rounded-lg"
                                    placeholder="0">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Unit</label>
                                <select id="unit" required class="w-full px-4 py-3 border-2 border-green-300 rounded-lg">
                                    <option value="boxes">Boxes</option>
                                    <option value="lbs">Pounds</option>
                                    <option value="oz">Ounces</option>
                                    <option value="gallons">Gallons</option>
                                    <option value="bottles">Bottles</option>
                                    <option value="each">Each</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Price ($)</label>
                            <input type="number" id="price" required min="0" step="0.01"
                                class="w-full px-4 py-3 border-2 border-green-300 rounded-lg"
                                placeholder="0.00">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Vendor (optional)</label>
                            <input type="text" id="vendor"
                                class="w-full px-4 py-3 border-2 border-green-300 rounded-lg"
                                placeholder="e.g., Home Depot, Amazon">
                        </div>

                        <div class="flex gap-3">
                            <button type="button" onclick="toggleAddForm()" class="flex-1 px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">
                                Cancel
                            </button>
                            <button type="submit" class="flex-1 px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-semibold">
                                Save Purchase
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        function toggleAddForm() {
            showAddForm = !showAddForm;
            render();
        }

        function savePurchase(event) {
            event.preventDefault();
            
            const purchase = {
                item: document.getElementById('item').value,
                quantity: Number(document.getElementById('quantity').value),
                unit: document.getElementById('unit').value,
                price: Number(document.getElementById('price').value),
                vendor: document.getElementById('vendor').value
            };

            BorateStor.savePurchase(purchase);
            showAddForm = false;
            render();
            showToast('Purchase logged!');
        }

        function deletePurchase(id) {
            if (confirm('Delete this purchase record?')) {
                BorateStor.deletePurchase(id);
                render();
                showToast('Purchase deleted');
            }
        }

        function formatItem(item) {
            const names = {
                'borax': 'Borax',
                'boric_acid': 'Boric Acid',
                'muriatic_acid': 'Muriatic Acid',
                'reagent_R0007': 'R-0007 (Thiosulfate)',
                'reagent_R0009': 'R-0009 (Sulfuric Acid)',
                'reagent_R0010': 'R-0010 (Calcium Buffer)',
                'reagent_BTB': 'BTB Indicator',
                'reagent_mannitol': 'Mannitol Powder',
                'other': 'Other'
            };
            return names[item] || item;
        }

        function formatDate(isoDate) {
            return new Date(isoDate).toLocaleDateString();
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg z-50';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Initial render
        render();
    </script>
</body>
</html>
