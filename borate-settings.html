<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings & Data - Borate Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="src/borate-calculations.js"></script>
    <script src="src/borate-storage.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
    <div id="root"></div>

    <script>
        function SettingsApp() {
            const stats = BorateStor.getStats();
            const poolVolume = BorateStor.getPoolVolume();
            const reminderFreq = BorateStor.getReminderFrequency();

            return `
                <div class="max-w-2xl mx-auto p-4">
                    <!-- Header -->
                    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <h1 class="text-2xl font-bold text-gray-900">⚙️ Settings & Data</h1>
                                <p class="text-gray-600 mt-1">Configure preferences and manage your data</p>
                            </div>
                            <a href="index.html" class="px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition">
                                ← Dashboard
                            </a>
                        </div>
                    </div>

                    <!-- Pool Configuration -->
                    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                        <h2 class="text-xl font-bold text-gray-900 mb-4">🏊 Pool Configuration</h2>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Pool Volume (gallons)</label>
                                <input type="number" id="poolVolume" value="${poolVolume}" min="1000" step="500"
                                    class="w-full px-4 py-3 text-xl border-2 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    placeholder="e.g., 36000"
                                    onchange="savePoolVolume(this.value)">
                                <p class="text-sm text-gray-500 mt-1">Used for dosage calculations</p>
                            </div>

                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Test Reminder (days)</label>
                                <select id="reminderFreq" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                                    onchange="saveReminderFreq(this.value)">
                                    <option value="30" ${reminderFreq === 30 ? 'selected' : ''}>Every 30 days</option>
                                    <option value="60" ${reminderFreq === 60 ? 'selected' : ''}>Every 60 days</option>
                                    <option value="90" ${reminderFreq === 90 ? 'selected' : ''}>Every 90 days</option>
                                    <option value="180" ${reminderFreq === 180 ? 'selected' : ''}>Every 180 days</option>
                                </select>
                                <p class="text-sm text-gray-500 mt-1">Dashboard will remind you to test</p>
                            </div>
                        </div>
                    </div>

                    <!-- Data Statistics -->
                    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                        <h2 class="text-xl font-bold text-gray-900 mb-4">📊 Stored Data</h2>
                        
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div class="bg-blue-50 rounded-lg p-4 text-center">
                                <div class="text-3xl font-bold text-blue-600">${stats.tests}</div>
                                <div class="text-sm text-gray-600">Total Tests</div>
                            </div>
                            <div class="bg-green-50 rounded-lg p-4 text-center">
                                <div class="text-3xl font-bold text-green-600">${stats.poolTests}</div>
                                <div class="text-sm text-gray-600">Pool Tests</div>
                            </div>
                            <div class="bg-orange-50 rounded-lg p-4 text-center">
                                <div class="text-3xl font-bold text-orange-600">${stats.additions}</div>
                                <div class="text-sm text-gray-600">Chemical Additions</div>
                            </div>
                            <div class="bg-purple-50 rounded-lg p-4 text-center">
                                <div class="text-3xl font-bold text-purple-600">${stats.purchases}</div>
                                <div class="text-sm text-gray-600">Purchases</div>
                            </div>
                        </div>

                        ${stats.daysSinceLastTest !== null ? `
                            <div class="bg-gray-50 rounded-lg p-4 text-center">
                                <span class="text-gray-600">Last test:</span>
                                <span class="font-semibold text-gray-900">${stats.daysSinceLastTest} days ago</span>
                            </div>
                        ` : `
                            <div class="bg-gray-50 rounded-lg p-4 text-center text-gray-500">
                                No tests recorded yet
                            </div>
                        `}
                    </div>

                    <!-- Export/Import -->
                    <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                        <h2 class="text-xl font-bold text-gray-900 mb-4">💾 Backup & Restore</h2>
                        
                        <div class="space-y-4">
                            <div>
                                <button onclick="exportData()" class="w-full px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-semibold">
                                    📥 Export Data (Download Backup)
                                </button>
                                <p class="text-sm text-gray-500 mt-1">Download all your data as a JSON file</p>
                            </div>

                            <div>
                                <label class="block w-full px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition font-semibold text-center cursor-pointer">
                                    📤 Import Data (Restore Backup)
                                    <input type="file" accept=".json" class="hidden" onchange="importData(event)">
                                </label>
                                <p class="text-sm text-gray-500 mt-1">Restore from a previously exported backup file</p>
                            </div>
                        </div>
                    </div>

                    <!-- Danger Zone -->
                    <div class="bg-white rounded-lg shadow-lg p-6 border-2 border-red-200">
                        <h2 class="text-xl font-bold text-red-900 mb-4">⚠️ Danger Zone</h2>
                        
                        <div class="bg-red-50 rounded-lg p-4 mb-4">
                            <p class="text-sm text-red-800">
                                <strong>Warning:</strong> Clearing data is permanent and cannot be undone. 
                                Make sure to export a backup first!
                            </p>
                        </div>

                        <button onclick="clearAllData()" class="w-full px-6 py-3 bg-red-600 text-white rounded-lg hover:bg-red-700 transition font-semibold">
                            🗑️ Clear All Data
                        </button>
                    </div>

                    <!-- Footer -->
                    <div class="text-center mt-8 text-gray-500 text-sm">
                        <p>Borate Management System v2.0</p>
                        <p class="mt-1">All data stored locally in your browser's localStorage</p>
                    </div>
                </div>
            `;
        }

        // Settings functions
        function savePoolVolume(value) {
            if (value && value > 0) {
                BorateStor.setPoolVolume(value);
                showToast('Pool volume saved!');
            }
        }

        function saveReminderFreq(value) {
            BorateStor.setReminderFrequency(Number(value));
            showToast('Reminder frequency saved!');
        }

        function exportData() {
            const data = BorateStor.exportData();
            const json = JSON.stringify(data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `borate-backup-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast('Data exported successfully!');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    const merge = confirm('Do you want to MERGE with existing data?\\n\\nClick OK to merge, Cancel to replace all data.');
                    const result = BorateStor.importData(data, merge);
                    showToast(`Imported: ${result.tests} tests, ${result.additions} additions, ${result.purchases} purchases`);
                    setTimeout(() => location.reload(), 1500);
                } catch (err) {
                    alert('Error importing data: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        function clearAllData() {
            if (confirm('Are you sure you want to delete ALL data?\\n\\nThis cannot be undone!')) {
                if (confirm('FINAL WARNING: All tests, additions, and settings will be permanently deleted.\\n\\nClick OK to proceed.')) {
                    BorateStor.clearAll();
                    showToast('All data cleared');
                    setTimeout(() => location.reload(), 1000);
                }
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg z-50';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Render
        document.getElementById('root').innerHTML = SettingsApp();
    </script>
</body>
</html>
